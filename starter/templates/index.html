<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/board.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
  <h1>Sudoku Game</h1>

  <div id="game-layout">
    <div id="left-controls" class="side-controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game">New Game</button>
    </div>

    <div id="sudoku-board"></div>

    <div id="right-controls" class="side-controls">
      <button id="check-solution">Check</button>
      <button id="hint-btn">Hint</button>
    </div>
  </div>

  <div id="status-row">
    <span id="timer">Time: 0:00</span>
    <span id="message"></span>
  </div>

  <section id="scoreboard">
    <h2>Top 10 Fastest Times</h2>
    <table>
      <thead>
        <tr><th>Rank</th><th>Name</th><th>Time</th><th>Level</th><th>Hints</th></tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>
  </section>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/timer.js"></script>
  <script src="/static/js/scoreboard.js"></script>
  <script src="/static/js/board.js"></script>
</body>
</html>
